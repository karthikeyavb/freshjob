filters:
  # Only keep jobs whose title/description mention one of these (engineering-focused).
  # Set to [] to keep every fresher role (sales, HR, design, etc.).
  role_keywords: [software, developer, engineer, sde, backend, frontend, full stack, fullstack,
                  web, data, ml, machine learning, ai, cloud, devops, sre, technology, tech]
  # Only keep jobs whose location mentions one of these (jobs with blank location are kept).
  location_keywords: [india, bengaluru, bangalore, hyderabad, mumbai, pune, chennai, delhi, gurgaon,
                      gurugram, noida, kolkata, ahmedabad, remote, vijayawada]

# ats: auto                                       -> agent tries to find the company's job board itself
#      (greenhouse/lever/ashby/smartrecruiters) and caches the result in sources_cache.json
# ats: greenhouse | lever | ashby | smartrecruiters  -> slug is the board name in the ATS URL
#      page                                         -> url is a static careers page (weak fallback)
#
# IMPORTANT: slugs/URLs below are best guesses. Run `python agent.py --verify` and fix or delete
# anything marked FAIL. To find a slug: open the company's careers page, click a job, and look at
# the URL (e.g. boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>).

